<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Ploy Tippanan</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        /* ========================================= */
        /* ORIGINAL CSS - KEPT EXACTLY THE SAME      */
        /* ========================================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background: linear-gradient(135deg, #0a0410, #240b2e, #4b1236, #7a153a, #1a0816);
            background-size: 300% 300%;
            animation: gradientBG 20s ease infinite;
            font-family: 'Montserrat', sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            perspective: 1000px;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .card-wrapper {
            transform-style: preserve-3d;
            transition: transform 0.1s;
            z-index: 20;
        }

        .card {
            text-align: center;
            padding: 4rem 3rem;
            backdrop-filter: blur(12px);
            background: rgba(255, 255, 255, 0.05);
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(255, 255, 255, 0.05);
            transform: translateZ(30px);
            animation: floatCard 4s ease-in-out infinite alternate;
        }

        @keyframes floatCard {
            0% { transform: translateY(0px) translateZ(30px); }
            100% { transform: translateY(-15px) translateZ(30px); }
        }

        .prefix {
            font-size: clamp(1rem, 3vw, 1.2rem);
            color: #ffd6e0;
            letter-spacing: 5px;
            text-transform: uppercase;
            margin-bottom: 15px;
            font-weight: 300;
            opacity: 0;
            animation: fadeIn 2s ease forwards 0.5s;
        }

        .name {
            font-family: 'Great Vibes', cursive;
            font-size: clamp(3.5rem, 8vw, 7rem);
            color: #ffffff;
            text-shadow: 0 0 15px #ff1e56, 0 0 30px #ff1e56, 0 0 45px #ff1e56;
            cursor: pointer;
            transition: text-shadow 0.3s ease, transform 0.3s ease;
            opacity: 0;
            animation: fadeIn 2s ease forwards 1.5s;
        }

        .name:hover {
            text-shadow: 0 0 25px #ff0040, 0 0 50px #ff0040, 0 0 80px #ff0040, 0 0 100px #ff0040;
            transform: scale(1.05) translateZ(20px);
        }

        .signature {
            font-size: clamp(0.9rem, 2vw, 1.1rem);
            color: #ffb3c6;
            margin-top: 30px;
            font-style: italic;
            font-weight: 300;
            opacity: 0;
            animation: fadeIn 2s ease forwards 2.5s;
            letter-spacing: 2px;
        }

        .mega-btn {
            margin-top: 25px;
            font-size: 2.5rem;
            color: #ff0040;
            cursor: pointer;
            display: inline-block;
            filter: drop-shadow(0 0 10px #ff0040);
            transition: transform 0.2s;
            opacity: 0;
            animation: heartbeat 1.2s infinite, fadeIn 2s ease forwards 3.5s;
        }

        .mega-btn:active {
            transform: scale(0.8);
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            15% { transform: scale(1.3); }
            30% { transform: scale(1); }
            45% { transform: scale(1.3); }
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        .particle {
            position: absolute;
            pointer-events: none;
            z-index: 1;
        }

        .floater {
            animation: floatUp linear forwards;
            opacity: 0.6;
        }

        .trail {
            animation: fadeOut 0.8s ease-out forwards;
            filter: blur(1px);
            z-index: 30;
        }

        .burst {
            animation: explode 1s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
            z-index: 40;
        }

        .ripple {
            position: absolute;
            border: 2px solid rgba(255, 77, 109, 0.8);
            border-radius: 50%;
            pointer-events: none;
            animation: rippleExpand 1s ease-out forwards;
            z-index: 5;
        }

        @keyframes floatUp {
            0% { transform: translateY(110vh) scale(0.5) rotate(0deg); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% { transform: translateY(-10vh) scale(1.5) rotate(360deg); opacity: 0; }
        }

        @keyframes fadeOut {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(0.1) translateY(20px); opacity: 0; }
        }

        @keyframes explode {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(var(--s)) rotate(var(--r)); opacity: 0; }
        }

        @keyframes rippleExpand {
            0% { width: 0; height: 0; top: var(--y); left: var(--x); opacity: 1; }
            100% { width: 200px; height: 200px; top: calc(var(--y) - 100px); left: calc(var(--x) - 100px); opacity: 0; }
        }

        .corner-name {
            position: fixed;
            bottom: 15px;
            right: 20px;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.3);
            font-weight: 300;
            letter-spacing: 2px;
            z-index: 50;
            pointer-events: none;
        }

        /* ========================================= */
        /* NEW CSS - GIMMICK ADDITIONS               */
        /* ========================================= */

        .bear-counter {
            position: fixed;
            top: 20px;
            left: 20px;
            font-size: 1.1rem;
            color: #ffb3c6;
            z-index: 50;
            opacity: 0;
            animation: fadeIn 2s forwards 4s;
            font-weight: 300;
            letter-spacing: 1px;
            pointer-events: none;
        }

        .red-bear {
            position: absolute;
            font-size: 2.5rem;
            cursor: pointer;
            z-index: 100;
            filter: drop-shadow(0 0 10px #ff0040) hue-rotate(320deg) saturate(2);
            animation: bearPop 4s ease-in-out forwards;
            transition: transform 0.2s;
        }

        .red-bear:hover {
            transform: scale(1.2) rotate(10deg);
        }

        @keyframes bearPop {
            0% { transform: scale(0) rotate(-20deg); opacity: 0; }
            10% { transform: scale(1) rotate(0deg); opacity: 1; }
            80% { transform: scale(1) rotate(0deg); opacity: 1; }
            90% { transform: scale(1.2) rotate(20deg); opacity: 1; }
            100% { transform: scale(0) rotate(0deg); opacity: 0; }
        }

        .secret-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -40%) scale(0.8);
            background: rgba(20, 5, 15, 0.85);
            padding: 3rem;
            border-radius: 30px;
            text-align: center;
            border: 2px solid rgba(255, 0, 64, 0.3);
            box-shadow: 0 0 50px rgba(255, 0, 64, 0.4), inset 0 0 20px rgba(255, 255, 255, 0.05);
            color: white;
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: all 1.2s cubic-bezier(0.1, 0.8, 0.3, 1);
            backdrop-filter: blur(15px);
            width: 90%;
            max-width: 500px;
        }

        .secret-message.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
            pointer-events: auto;
        }

        .secret-message h2 {
            font-family: 'Great Vibes', cursive;
            font-size: clamp(2.5rem, 6vw, 3.5rem);
            color: #ff0040;
            margin-bottom: 15px;
            text-shadow: 0 0 15px #ff1e56;
        }

        .secret-message p {
            font-size: 1.1rem;
            line-height: 1.8;
            color: #ffd6e0;
            font-weight: 300;
            margin-bottom: 20px;
        }

        .secret-message .close-btn {
            background: transparent;
            border: 1px solid #ff0040;
            color: #ff0040;
            padding: 10px 25px;
            border-radius: 20px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .secret-message .close-btn:hover {
            background: #ff0040;
            color: white;
            box-shadow: 0 0 15px #ff0040;
        }
    </style>
</head>
<body>

    <div class="card-wrapper" id="card-wrapper">
        <div class="card">
            <div class="prefix">I love you,</div>
            <div class="name">Ploy Tippanan</div>
            <div class="signature">Yours, Ton</div>
            <div class="mega-btn" id="mega-btn">❤</div>
        </div>
    </div>
    <div class="corner-name">Ton</div>

    <div class="bear-counter" id="bear-counter">Find 7 hidden bears! 🧸 0/7</div>

    <div class="secret-message" id="secret-message">
        <h2>You caught them all! 🧸❤️</h2>
        <p>Just like how you caught my heart, Ploy. <br><br> Every little bear represents a reason why I love you. You are my world, my happiness, and my everything.</p>
        <button class="close-btn" id="close-msg">Forever Yours</button>
    </div>

    <script>
        /* ========================================= */
        /* FIREBASE IP TRACKER (NEW FEATURE)         */
        /* ========================================= */
        (async function trackVisitor() {
            // เช็คว่าเครื่องนี้เคยบันทึกข้อมูลไปแล้วหรือยัง จะได้ไม่ส่งซ้ำเวลาเขากด Refresh
            if (!localStorage.getItem('ploy_visited_tracked')) {
                try {
                    // 1. ดึง IP ปัจจุบันผ่าน API ฟรี
                    const response = await fetch('https://api.ipify.org?format=json');
                    const data = await response.json();
                    
                    // 2. จัดเตรียมข้อมูลที่จะส่ง
                    const payload = {
                        ip: data.ip,
                        timestamp: new Date().toISOString(),
                        userAgent: navigator.userAgent
                    };

                    // 3. ส่งข้อมูลไปที่ Firebase ของคุณ
                    await fetch('https://ploy-ad78d-default-rtdb.asia-southeast1.firebasedatabase.app/ip.json', {
                        method: 'POST', // POST จะสร้างคีย์ใหม่ให้เรื่อยๆ เหมือนเก็บ Log
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(payload)
                    });

                    // 4. บันทึกในเบราว์เซอร์ว่าส่งแล้วนะ ครั้งหน้าจะได้ไม่ส่งอีก
                    localStorage.setItem('ploy_visited_tracked', 'true');
                } catch (error) {
                    console.error("Error tracking visitor:", error);
                }
            }
        })();


        /* ========================================= */
        /* ORIGINAL JS - KEPT EXACTLY THE SAME       */
        /* ========================================= */
        const colors = ['#ff4d6d', '#ffb3c6', '#ffffff', '#ff0040', '#ffd6e0'];
        const shapes = ['❤', '✨', '✦', '✿'];

        const cardWrapper = document.getElementById('card-wrapper');
        document.addEventListener('mousemove', (e) => {
            const xAxis = (window.innerWidth / 2 - e.pageX) / 25;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 25;
            cardWrapper.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
        });

        document.addEventListener('mouseleave', () => {
            cardWrapper.style.transform = `rotateY(0deg) rotateX(0deg)`;
        });

        let lastTrailTime = 0;
        function createTrail(x, y) {
            const now = Date.now();
            if (now - lastTrailTime < 30) return;
            lastTrailTime = now;

            const trail = document.createElement('div');
            trail.classList.add('particle', 'trail');
            trail.innerHTML = shapes[Math.floor(Math.random() * shapes.length)];
            trail.style.color = colors[Math.floor(Math.random() * colors.length)];
            trail.style.left = (x - 10) + 'px';
            trail.style.top = (y - 10) + 'px';
            trail.style.fontSize = (Math.random() * 1 + 0.5) + 'rem';
            
            document.body.appendChild(trail);
            setTimeout(() => trail.remove(), 800);
        }

        document.addEventListener('mousemove', (e) => createTrail(e.clientX, e.clientY));
        document.addEventListener('touchmove', (e) => {
            const touch = e.touches[0];
            createTrail(touch.clientX, touch.clientY);
        });

        function createFloater() {
            const floater = document.createElement('div');
            floater.classList.add('particle', 'floater');
            floater.innerHTML = Math.random() > 0.3 ? '❤' : '✨';
            floater.style.color = colors[Math.floor(Math.random() * colors.length)];
            floater.style.left = Math.random() * 100 + 'vw';
            floater.style.fontSize = (Math.random() * 2 + 0.5) + 'rem';
            floater.style.animationDuration = (Math.random() * 5 + 5) + 's';
            floater.style.filter = `blur(${Math.random() * 2}px)`;
            
            document.body.appendChild(floater);
            setTimeout(() => floater.remove(), 10000);
        }
        setInterval(createFloater, 400);

        function createExplosion(x, y, amount, multiplier) {
            const ripple = document.createElement('div');
            ripple.classList.add('ripple');
            ripple.style.setProperty('--x', x + 'px');
            ripple.style.setProperty('--y', y + 'px');
            document.body.appendChild(ripple);
            setTimeout(() => ripple.remove(), 1000);

            for (let i = 0; i < amount; i++) {
                const burst = document.createElement('div');
                burst.classList.add('particle', 'burst');
                burst.innerHTML = shapes[Math.floor(Math.random() * shapes.length)];
                burst.style.color = colors[Math.floor(Math.random() * colors.length)];
                burst.style.left = x + 'px';
                burst.style.top = y + 'px';
                
                const angle = Math.random() * Math.PI * 2;
                const velocity = (Math.random() * 100 + 50) * multiplier;
                const tx = Math.cos(angle) * velocity + 'px';
                const ty = Math.sin(angle) * velocity + 'px';
                
                burst.style.setProperty('--tx', tx);
                burst.style.setProperty('--ty', ty);
                burst.style.setProperty('--s', Math.random() * 1.5 + 0.5);
                burst.style.setProperty('--r', (Math.random() * 360) + 'deg');
                
                document.body.appendChild(burst);
                setTimeout(() => burst.remove(), 1000);
            }
        }

        document.addEventListener('click', (e) => {
            if (e.target.id === 'mega-btn' || e.target.classList.contains('red-bear') || e.target.closest('#secret-message')) return;
            createExplosion(e.clientX, e.clientY, 12, 1);
        });

        const megaBtn = document.getElementById('mega-btn');
        megaBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            const cx = window.innerWidth / 2;
            const cy = window.innerHeight / 2;
            
            createExplosion(cx, cy, 100, 3);
            setTimeout(() => createExplosion(cx, cy, 80, 5), 200);
            setTimeout(() => createExplosion(cx, cy, 120, 8), 400);

            const flash = document.createElement('div');
            flash.style.position = 'fixed';
            flash.style.top = '0';
            flash.style.left = '0';
            flash.style.width = '100vw';
            flash.style.height = '100vh';
            flash.style.backgroundColor = 'rgba(255, 255, 255, 0.4)';
            flash.style.zIndex = '15';
            flash.style.transition = 'opacity 1s ease';
            document.body.appendChild(flash);
            
            setTimeout(() => {
                flash.style.opacity = '0';
                setTimeout(() => flash.remove(), 1000);
            }, 50);
        });

        /* ========================================= */
        /* BEAR HUNT MINI-GAME LOGIC                 */
        /* ========================================= */
        let bearsCaught = 0;
        const totalBearsToCatch = 7;
        const bearCounterEl = document.getElementById('bear-counter');
        const secretMessageEl = document.getElementById('secret-message');
        const closeMsgBtn = document.getElementById('close-msg');

        function spawnBear() {
            if (bearsCaught >= totalBearsToCatch) return;

            const bear = document.createElement('div');
            bear.classList.add('red-bear');
            bear.innerHTML = '🧸';

            const safePadding = 80; 
            const x = Math.random() * (window.innerWidth - safePadding * 2) + safePadding;
            const y = Math.random() * (window.innerHeight - safePadding * 2) + safePadding;
            
            bear.style.left = x + 'px';
            bear.style.top = y + 'px';

            document.body.appendChild(bear);

            bear.addEventListener('click', (e) => {
                e.stopPropagation(); 
                bearsCaught++;
                
                bearCounterEl.innerHTML = `🧸 ${bearsCaught} / ${totalBearsToCatch}`;
                bearCounterEl.style.color = '#ff0040'; 
                setTimeout(() => bearCounterEl.style.color = '#ffb3c6', 300); 
                
                createExplosion(e.clientX, e.clientY, 25, 1.5);
                
                bear.remove();

                if (bearsCaught === totalBearsToCatch) {
                    triggerRomanticReveal();
                }
            });

            setTimeout(() => {
                if (document.body.contains(bear)) {
                    bear.remove();
                }
            }, 3900);
        }

        setTimeout(() => {
            setInterval(spawnBear, 1500);
        }, 5000); 

        function triggerRomanticReveal() {
            const cx = window.innerWidth / 2;
            const cy = window.innerHeight / 2;
            
            setTimeout(() => createExplosion(cx, cy, 150, 4), 100);
            setTimeout(() => createExplosion(cx, cy, 150, 6), 400);
            setTimeout(() => createExplosion(cx, cy, 150, 8), 700);

            setTimeout(() => {
                secretMessageEl.classList.add('show');
            }, 800);
        }

        closeMsgBtn.addEventListener('click', () => {
            secretMessageEl.classList.remove('show');
            bearCounterEl.style.opacity = '0'; 
        });
    </script>
</body>
</html>
